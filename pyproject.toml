[project]
name = "voxdesk"
version = "0.1.0"
description = "VoxDesk — portable AI call-center voice agent: any company's docs become a support hotline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
    "fastembed>=0.4",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
